name: Sync Public Telemetry

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/generate_telemetry.py"

permissions:
  contents: write

jobs:
  telemetry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate public telemetry SVG
        run: python scripts/generate_telemetry.py
      - name: Commit telemetry if changed
        run: |
          git config user.name "joe-command-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/live-telemetry.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: sync public profile telemetry"
          git push
