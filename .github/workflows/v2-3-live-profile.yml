name: V3 Mission Control Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/update_profile.py"
      - ".github/workflows/v2-3-live-profile.yml"

permissions:
  contents: write
  actions: read
  pull-requests: read
  issues: read

concurrency:
  group: profile-v3-mission-control
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate V3 mission control surface
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_profile.py

      - name: Commit only when public state changed
        run: |
          if git diff --quiet -- README.md assets/live-command.svg; then
            echo "No mission-control telemetry changes."
            exit 0
          fi
          git config user.name "joe-command-bot"
          git config user.email "actions@users.noreply.github.com"
          git add README.md assets/live-command.svg
          git commit -m "chore(profile): sync v3 mission control"
          git push
